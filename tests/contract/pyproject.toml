[project]
name = "pialy-contract"
version = "0.0.0"
description = "Black-box contract suite for the pialy backends, with a fake pey server."
requires-python = ">=3.13"
dependencies = [
    "agent-toolkit-webhooks @ git+https://github.com/jovandyaz/agent-toolkit@v0.1.0rc1#subdirectory=packages/webhooks",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
]

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
pythonpath = ["."]
testpaths = ["."]
strict_markers = true
markers = [
    "ts_only(reason): behavior only the TS server has (by default its PIN session)",
    "py_only(reason): behavior only the Python server has (by default its account session)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
