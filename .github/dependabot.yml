# Keeps the SHA-pinned actions and the digest-pinned compose images current. Python and JS
# dependencies are not listed: their lockfiles are audited in CI (pip-audit, pnpm audit).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release gets a week to be found bad before it is proposed.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # docker-compose.test.yml (and docker-compose.yml). After a bump, copy the digest into the
  # matching service in .github/workflows/ci.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A PostgreSQL major version is an upgrade with its own migration, not a dependency bump.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
