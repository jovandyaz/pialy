[project]
name = "pialy-api"
version = "0.0.0"
description = "pialy Python backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "psycopg[binary]",
  "psycopg_pool",
  "alembic",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "argon2-cffi",
  "cryptography",
]

[project.optional-dependencies]
sentry = ["sentry-sdk>=2,<3"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "import-linter", "pip-audit", "httpx2>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pialy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
plugins = ["pydantic.mypy"]
