[project]
name = "pialy-api"
version = "0.0.0"
description = "pialy Python backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "psycopg[binary]",
  "psycopg_pool",
  "alembic",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "argon2-cffi",
  "cryptography",
  "agent-toolkit-audit-log @ git+https://github.com/jovandyaz/agent-toolkit@v0.1.0rc1#subdirectory=packages/audit-log",
]

[project.optional-dependencies]
sentry = ["sentry-sdk>=2,<3"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff", "mypy", "import-linter", "pip-audit", "httpx2>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The agent-toolkit packages are PEP 508 git references pinned to a tag (and to a commit in uv.lock).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pialy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes shared test code importable by the path mypy names it by (tests.db.support).
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.isort]
known-first-party = ["tests"]  # shared test code, imported as tests.db.support

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
# Name test modules by path (tests.conftest, tests.db.conftest) so equal file names do not clash.
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# Supply-chain cooldown: uv ignores releases younger than 7 days, so a hijacked release is not
# picked up the day it appears. The lock records the span (`exclude-newer-span = "P7D"`) and is
# not re-resolved as time passes. See "Dependencies" in AGENTS.md to upgrade or to exempt a package.
[tool.uv]
exclude-newer = "7 days"
